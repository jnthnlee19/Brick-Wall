<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brick Wall Gallery</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f2f0eb}
body{font-family:"Avenir Next",Avenir,"Segoe UI",Arial,sans-serif;color:#171717}
.page{max-width:1708px;margin:0 auto;padding:14px 16px 105px}
.top-row{display:grid;grid-template-columns:repeat(3,1fr);gap:70px;margin:0 25px 20px}
.row-one{display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr 1.4fr 1fr 1.4fr 1fr 1fr;gap:25px;align-items:start;margin-bottom:20px}
.standard-row{display:grid;grid-template-columns:repeat(10,1fr);gap:25px;align-items:start;margin-bottom:20px}

.sample-card{width:100%;min-width:0;border:0;background:#fff;padding:9px 9px 0;border-radius:3px;box-shadow:0 3px 7px rgba(0,0,0,.18);cursor:pointer;font:inherit;color:inherit;transition:opacity .18s ease,filter .18s ease,transform .12s ease}
.sample-card:hover{transform:translateY(-1px)}
.sample-card:focus-visible{outline:2px solid rgba(0,0,0,.55);outline-offset:3px}
.sample-image-wrap{overflow:hidden;background:#ddd;line-height:0}
.sample-image{display:block;width:100%;height:auto;aspect-ratio:1.62/1;object-fit:cover}
.sample-name{padding:8px 3px 9px;text-align:center;font-size:clamp(13px,1vw,18px);line-height:1.05;white-space:nowrap;overflow:hidden}
.brick-card[data-brick="Mocha Brown Antique"] .sample-name{font-size:clamp(10px,.82vw,15px)}
.stone-card{padding:10px 10px 0}
.stone-card .sample-image{aspect-ratio:1.84/1}
.stone-card .sample-name{font-size:clamp(16px,1.08vw,20px);padding:8px 3px 10px}
.monitor{height:121px;background:linear-gradient(135deg,#111,#262626);border:2px solid #141414;box-shadow:0 3px 7px rgba(0,0,0,.15)}

/* Group filtering is now simple because every brick is a real element. */
body.group-active .brick-card{opacity:.18;filter:grayscale(1)}
body.group-active .brick-card.group-match{opacity:1;filter:none}
body.group-active .stone-card{opacity:1;filter:none}
body.group-active .monitor{opacity:.24}

.group-filters{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;gap:10px;padding:10px 12px;background:rgba(255,255,255,.93);border:1px solid rgba(0,0,0,.12);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.16);backdrop-filter:blur(8px)}
.group-filter{border:1px solid #c8c8c8;background:#fff;border-radius:999px;padding:9px 16px;font:inherit;cursor:pointer}
.group-filter.active{background:#222;color:#fff;border-color:#222}

.modal{position:fixed;inset:0;z-index:1000;display:none;padding:24px;background:rgba(0,0,0,.78);backdrop-filter:blur(3px)}
.modal.open{display:grid;place-items:center}
.panel{width:min(1180px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 28px 90px rgba(0,0,0,.4)}
.header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:15px 17px;background:rgba(255,255,255,.97);border-bottom:1px solid #e4e4e4;backdrop-filter:blur(12px)}
.title{flex:1;margin:0;text-align:center;font-size:25px;font-weight:600;line-height:1.2}
.round{flex:0 0 auto;width:43px;height:43px;border-radius:50%;border:1px solid #d4d4d4;background:#fff;cursor:pointer;font-size:25px;line-height:1}
.round:hover,.nav:hover{background:#f2f2f2}
.gallery{padding:20px}
.hero{display:grid;place-items:center;min-height:380px;background:#f3f3f3;border-radius:11px;overflow:hidden}
.hero img{display:block;width:100%;max-height:66vh;object-fit:contain}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;margin-top:14px}
.thumb{border:2px solid transparent;background:#f3f3f3;border-radius:8px;overflow:hidden;cursor:pointer;padding:0}
.thumb.active{border-color:#111}
.thumb img{display:block;width:100%;height:100px;object-fit:cover}
.empty{display:none;padding:40px 20px;text-align:center;color:#666;line-height:1.5}
.empty.show{display:block}
.bottom-nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.nav{border:1px solid #ccc;background:#fff;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer}

@media(max-width:1100px){
  .top-row{gap:28px;margin-inline:0}
  .row-one,.standard-row{grid-template-columns:repeat(5,1fr);gap:18px}
  .monitor{height:100px}
}
@media(max-width:720px){
  .page{padding:10px 10px 92px}
  .top-row{grid-template-columns:1fr;gap:18px}
  .row-one,.standard-row{grid-template-columns:repeat(2,1fr);gap:14px 12px}
  .sample-name{white-space:normal;font-size:14px}
  .group-filters{bottom:10px;gap:6px;padding:8px}
  .group-filter{padding:8px 10px;font-size:13px}
  .modal{padding:7px} .panel{max-height:97vh} .title{font-size:19px}
  .round{width:38px;height:38px} .gallery{padding:10px} .hero{min-height:240px}
}
</style>
</head>

<script>
/*
  QUICK MAINTENANCE NOTES
  -----------------------
  HOMEPAGE THUMBNAIL:
  The homepage thumbnail shown on each card is:
      images/FOLDER-NAME/10.jpg

  Example:
      images/stone-bay/10.jpg

  BRICK NAME CHANGES:
  If you replace a brick, update its visible card name/data-brick below in the HTML,
  then update the matching entries in `order`, `folders`, and `groups` here.
*/
const order = ["Cream Stone", "Texas Mix", "Smokey Mountain", "White Burch", "Winterfield", "Grey Fog", "Castle Rock", "Old Francisco", "Green Hollow", "Frostwood", "Cibolo Trail", "Smokey River", "Saxon", "Carlton", "Fall Creek", "Nocona", "Sonoran Desert", "Adobe Wells", "Jefferson Park", "Cottonwood", "Stone Bay", "Rochester", "Marble", "Porter", "Grand Isle", "Urbana Antique", "Mocha Brown Antique", "Wood Creek", "Grayson"];
const folders = {"Cream Stone": "cream-stone", "Texas Mix": "texas-mix", "Smokey Mountain": "smokey-mountain", "Cottonwood": "cottonwood", "Smokey River": "smokey-river", "Marble": "marble", "Urbana Antique": "urbana-antique", "Green Hollow": "green-hollow", "Wood Creek": "wood-creek", "Frostwood": "frostwood", "Stone Bay": "stone-bay", "Cibolo Trail": "cibolo-trail", "Rochester": "rochester", "Sonoran Desert": "sonoran-desert", "Mocha Brown Antique": "mocha-brown-antique", "Fall Creek": "fall-creek", "Old Francisco": "old-francisco", "Porter": "porter", "White Burch": "white-burch", "Winterfield": "winterfield", "Grey Fog": "grey-fog", "Grand Isle": "grand-isle", "Saxon": "saxon", "Carlton": "carlton", "Nocona": "nocona", "Adobe Wells": "adobe-wells", "Grayson": "grayson", "Jefferson Park": "jefferson-park", "Castle Rock": "castle-rock"};
// ============================================================
// EDIT BRICK GROUPS HERE
// ============================================================
// Change ONLY the group name on the right when a brick moves.
// Valid choices: "Group 1", "Group 3", "Group 4", "Group 5"
//
// Example:
// "Stone Bay": "Group 4",
//
// Stone selections do not need to be listed here.
// ============================================================
const groups = {
  "Rochester": "Group 1",
  "Carlton": "Group 1",
  "Marble": "Group 1",
  "Winterfield": "Group 1",
  "Wood Creek": "Group 1",
  "Urbana Antique": "Group 1",
  "Saxon": "Group 1",
  "Green Hollow": "Group 1",

  "Stone Bay": "Group 3",
  "Fall Creek": "Group 3",
  "Old Francisco": "Group 3",
  "Sonoran Desert": "Group 3",
  "Adobe Wells": "Group 3",
  "Grey Fog": "Group 3",
  "Mocha Brown Antique": "Group 3",
  "Cibolo Trail": "Group 3",

  "Cottonwood": "Group 4",
  "Frostwood": "Group 4",
  "White Burch": "Group 4",
  "Grayson": "Group 5",
  "Grand Isle": "Group 5",
  "Porter": "Group 5",
  "Jefferson Park": "Group 5",

  "Smokey River": "Group 5",
  "Nocona": "Group 5",

  "Castle Rock": "Group 5"  // Assign Group 1, 3, 4, or 5 here
};
// ============================================================
// END EDIT BRICK GROUPS
// ============================================================
const modal = document.getElementById('modal');
const title = document.getElementById('title');
const hero = document.getElementById('hero');
const heroWrap = document.getElementById('heroWrap');
const thumbs = document.getElementById('thumbs');
const empty = document.getElementById('empty');
let current = null;
let currentImages = [];

async function findGalleryImages(name) {
  const folder = folders[name];
  const paths = Array.from({length:30}, (_,i) => `images/${folder}/${String(i+1).padStart(2,'0')}.jpg`);
  const checks = paths.map(src => new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(src);
    img.onerror = () => resolve(null);
    img.src = src;
  }));
  return (await Promise.all(checks)).filter(Boolean);
}

function showImage(i) {
  if (!currentImages.length) return;
  hero.src = currentImages[i];
  hero.alt = current + ' image ' + (i+1);
  [...thumbs.children].forEach((el,j)=>el.classList.toggle('active',j===i));
}

async function openBrick(name) {
  current = name;
  title.textContent = groups[name] ? `${name} — ${groups[name]}` : name;
  thumbs.innerHTML = '';
  hero.removeAttribute('src');
  heroWrap.style.display = 'none';
  empty.classList.remove('show');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';

  currentImages = await findGalleryImages(name);
  if (!currentImages.length) {
    empty.classList.add('show');
    return;
  }

  heroWrap.style.display = 'grid';
  currentImages.forEach((src,i)=>{
    const b = document.createElement('button');
    b.className = 'thumb' + (i===0 ? ' active' : '');
    b.type = 'button';
    const im = document.createElement('img');
    im.src = src;
    im.alt = '';
    b.appendChild(im);
    b.addEventListener('click',()=>showImage(i));
    thumbs.appendChild(b);
  });
  showImage(0);
}

function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}
function move(delta){const i=order.indexOf(current);openBrick(order[(i+delta+order.length)%order.length])}

document.querySelectorAll('.sample-card').forEach(btn=>btn.addEventListener('click',()=>openBrick(btn.dataset.brick)));

document.querySelectorAll('.group-filter').forEach(button=>{
  button.addEventListener('click',()=>{
    const groupName = button.dataset.group;
    const alreadyActive = button.classList.contains('active');

    // Clear any current filter first.
    document.querySelectorAll('.group-filter').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.brick-card').forEach(card=>card.classList.remove('group-match'));
    document.body.classList.remove('group-active');

    // Clicking the selected group again turns filtering off.
    if (alreadyActive) return;

    button.classList.add('active');

    // Mark bricks assigned to this group in the editable `groups` section.
    document.querySelectorAll('.brick-card').forEach(card=>{
      const brickName = card.dataset.brick;
      if (groups[brickName] === groupName) {
        card.classList.add('group-match');
      }
    });

    document.body.classList.add('group-active');
  });
});

document.getElementById('close').addEventListener('click',closeModal);
document.getElementById('prevTop').addEventListener('click',()=>move(-1));
document.getElementById('nextTop').addEventListener('click',()=>move(1));
document.getElementById('prevBottom').addEventListener('click',()=>move(-1));
document.getElementById('nextBottom').addEventListener('click',()=>move(1));
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{
  if(!modal.classList.contains('open'))return;
  if(e.key==='Escape')closeModal();
  if(e.key==='ArrowLeft')move(-1);
  if(e.key==='ArrowRight')move(1);
});
</script>
</body>
